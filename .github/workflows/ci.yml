# CI（docs/environment/setup.md §5）。
# セルフホステッドランナー（Linux）で実行する。ランナーのホストには Wails の依存
# （gcc・gtk4・webkitgtk-6.0 の開発パッケージ）を事前に導入しておく。ジョブ内で apt / sudo は使わない。
# ランナーのラベルは登録するランナーに合わせて確定する（現状は self-hosted, linux, x64）。
# Android（android/）のジョブには JDK 17 と Android SDK（ANDROID_HOME）も事前に導入しておく（docs/environment/setup.md §11.1）。
# Go 側と Android 側のジョブは、変更されたファイルに応じて changes ジョブの結果で出し分ける（workflow の paths は使わない）。
name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

# 同じ ref の古い実行をキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  TASK_VERSION: 3.x
  BUN_VERSION: 1.3.14

jobs:
  # 変更されたファイルから、Go 側と Android 側のジョブを動かすかを決める。パスの分けは workflow の `paths` でなくジョブの `if` で行う
  # （`paths` で workflow ごと止めると、必須チェックが pending のまま残るため。`if` で skip したジョブは必須チェックでは成功として扱われる）。
  # 迷ったときは動かす側に倒す（.github/scripts/detect-changes.sh）。fork の PR では動かさない（下のジョブも同じ）。
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    outputs:
      go: ${{ steps.detect.outputs.go }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0 # 比較元のコミット（PR の base・push の before）まで取る
          persist-credentials: false
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 比較元が無い（新しいブランチの最初の push は before が全部 0。force push で消えたコミット）・差分が取れないときは、
          # 印の `*` を渡して両方動かす
          if ! changed="$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null)"; then
            changed='*'
          fi
          echo "changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          printf '%s\n' "$changed" | bash .github/scripts/detect-changes.sh

  lint:
    # セルフホステッドランナーで信頼できないコードを実行しないよう、
    # pull_request は同一リポジトリのブランチ（fork 以外）のときだけ実行する。
    if: needs.changes.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: changes
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # セルフホステッドでは post ステップのキャッシュ保存が 20 分以上止まったため無効にする。
          # Go のモジュール・ビルドキャッシュはランナーのローカルに残る。
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - run: bun install --frozen-lockfile
      # 最初の検査より前に必ず生成する（*_templ.go・static/dist/ が無いと golangci-lint が失敗する）。
      - run: task generate
      # Wails（internal/app 直下と main.go）は Linux では gtk4・webkitgtk-6.0・libsoup-3.0 の開発パッケージを要する。
      # このランナーには未導入のため、Linux の検査対象から外し、Windows 向け（CGO 不要）の検査で補う。
      - name: Linux の検査対象パッケージを決める
        run: |
          mod="$(go list -m)"
          pkgs="$(go list ./... | grep -vxF -e "${mod}" -e "${mod}/internal/app" | sed "s|^${mod}|.|" | tr '\n' ' ')"
          echo "LINUX_PKGS=${pkgs}" >> "$GITHUB_ENV"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: |
          # shellcheck disable=SC2086
          golangci-lint run ${LINUX_PKGS}
      - name: golangci-lint (windows)
        run: golangci-lint run ./...
        env:
          CGO_ENABLED: "0"
          GOOS: windows
      - run: go tool templ fmt -fail .
      - run: bunx biome check .
      - run: bunx linterly check

  test:
    if: needs.changes.outputs.go == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: changes
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # セルフホステッドでは post ステップのキャッシュ保存が 20 分以上止まったため無効にする。
          # Go のモジュール・ビルドキャッシュはランナーのローカルに残る。
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - run: bun install --frozen-lockfile
      - run: task generate
      # Wails（internal/app 直下と main.go）は Linux では gtk4・webkitgtk-6.0・libsoup-3.0 の開発パッケージを要する。
      # このランナーには未導入のため、Linux の検査対象から外し、Windows 向け（CGO 不要）の検査で補う。
      - name: Linux の検査対象パッケージを決める
        run: |
          mod="$(go list -m)"
          pkgs="$(go list ./... | grep -vxF -e "${mod}" -e "${mod}/internal/app" | sed "s|^${mod}|.|" | tr '\n' ' ')"
          echo "LINUX_PKGS=${pkgs}" >> "$GITHUB_ENV"
      - run: |
          # shellcheck disable=SC2086
          go vet ${LINUX_PKGS}
      # OS 別のビルドタグを持つコード（go-keyring・SQLite ドライバ・filepath まわり）を
      # Linux のランナーでもコンパイルして検査する。Wails（internal/app・main.go）は Windows なら CGO なしで
      # コンパイルできるので windows の検査に含める。darwin は Wails が CGO を要するため対象外。
      - name: go vet (windows)
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
          GOOS: windows
      - name: go vet (darwin)
        run: go vet ./internal/domain/... ./internal/repository/... ./internal/service/... ./internal/web/...
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
      - run: |
          # shellcheck disable=SC2086
          go test ${LINUX_PKGS}
      # release.yml の plan ジョブが使う plan-release.sh の表駆動テスト（ネットワーク不要）。
      - name: plan-release.sh のテスト
        run: bash .github/scripts/plan-release_test.sh
      # release.yml の build-windows ジョブが使う install-nsis.sh の取得（再試行・sha256 検証）のテスト（ネットワーク不要）。
      - name: install-nsis.sh のテスト
        run: bash .github/scripts/install-nsis_test.sh
      # release.yml の build-android ジョブが使う、APK の版（versionName・versionCode）を決める android-version.sh の表駆動テスト（ネットワーク不要）。
      - name: android-version.sh のテスト
        run: bash .github/scripts/android-version_test.sh
      # 同、APK の署名・検証・後始末の sign-android-apk.sh のテスト（apksigner などは偽物に差し替える。SDK・ネットワーク不要）。
      - name: sign-android-apk.sh のテスト
        run: bash .github/scripts/sign-android-apk_test.sh
      # 上の changes ジョブが使う detect-changes.sh の表駆動テスト（ネットワーク・git 不要）。
      - name: detect-changes.sh のテスト
        run: bash .github/scripts/detect-changes_test.sh

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, test]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # セルフホステッドでは post ステップのキャッシュ保存が 20 分以上止まったため無効にする。
          # Go のモジュール・ビルドキャッシュはランナーのローカルに残る。
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - run: bun install --frozen-lockfile
      - run: task generate
      # wails3 CLI 自体が Linux では gtk4・webkitgtk-6.0 の開発パッケージ（このランナーには未導入）を要するため、
      # CLI は使わず Windows 向け（CGO 不要）に直接ビルドして、コンパイルできることだけを確認する。成果物は配布しない。
      - name: go build (windows)
        run: go build -tags production -o "${RUNNER_TEMP}/swarm-viewer.exe" .
        env:
          CGO_ENABLED: "0"
          GOOS: windows

  # --- Android（android/。docs/environment/setup.md §11.2）---
  # ランナーのホストに JDK 17 と Android SDK（ANDROID_HOME）を事前に導入しておく。ジョブ内で apt / sudo / sdkmanager は使わない。
  # 未導入のときは check-android-env.sh が不足を 1 行で示して失敗する（運用作業。ランナーが整うまでは Android のジョブが赤になる）。
  # Gradle のキャッシュは保存するステップを置かず、ランナーのローカル（GRADLE_USER_HOME）に任せる。署名鍵などのシークレットは使わない。
  android-lint:
    if: needs.changes.outputs.android == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: changes
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - run: bash .github/scripts/check-android-env.sh
      # Kotlin の手書きソースにも linterly の行数上限が掛かる。Go 側の lint ジョブは android/ だけの変更では動かないため、ここでも検査する。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx linterly check
      - run: ./gradlew lint ktlintCheck
        working-directory: android

  android-test:
    if: needs.changes.outputs.android == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: changes
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - run: bash .github/scripts/check-android-env.sh
      - run: ./gradlew test
        working-directory: android

  android-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [android-lint, android-test]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - run: bash .github/scripts/check-android-env.sh
      # コンパイルできることの確認だけ。debug 署名の APK は配布しない（成果物はアップロードしない）。
      - run: ./gradlew assembleDebug
        working-directory: android
