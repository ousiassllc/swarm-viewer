# 使い捨ての dry-run（PR には含めない）
name: Release dry-run
on:
  push:
    branches: [verify/3-release-dryrun]
permissions:
  contents: read
env:
  TASK_VERSION: 3.x
  BUN_VERSION: 1.3.14
  NSIS_VERSION: 3.11.0

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: v9.8.7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # リリースの成果物に、他のワークフローが書いたキャッシュを混ぜない
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install the wails3 CLI (the version in go.mod)
        run: |
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          [ -n "$wails_version" ] || { echo "::error::cannot read the wails version from go.mod"; exit 1; }
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/wailsapp/wails/v3/cmd/wails3@${wails_version}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install NSIS if makensis is missing
        run: |
          if ! command -v makensis >/dev/null 2>&1 && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis --version="$NSIS_VERSION" --yes --no-progress
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Set the version from the tag
        run: bash .github/scripts/set-version.sh "$TAG"
      - name: Build the NSIS installer
        run: |
          makensis -VERSION
          task package
      - name: Diagnose version resources
        run: |
          for f in bin/swarm-viewer.exe bin/swarm-viewer-amd64-installer.exe; do
            echo "=== $f (powershell 5.1)"
            powershell -NoProfile -ExecutionPolicy Bypass -File .github/diag/verinfo.ps1 "$f"
            echo "=== $f (pwsh)"
            pwsh -NoProfile -File .github/diag/verinfo.ps1 "$f" || true
          done
          mkdir -p "$RUNNER_TEMP/rd" && cd "$RUNNER_TEMP/rd"
          cp "$GITHUB_WORKSPACE/.github/diag/rd.go.txt" main.go
          printf 'module rd\ngo 1.22\nrequire github.com/tc-hib/winres v0.3.1\n' > go.mod
          GOFLAGS=-mod=mod go run . "$GITHUB_WORKSPACE/bin/swarm-viewer.exe"
          cd "$GITHUB_WORKSPACE"
          mkdir dist
          mv bin/swarm-viewer-amd64-installer.exe "dist/swarm-viewer_${TAG}_windows_amd64_installer.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: dryrun-windows
          path: dist/
          if-no-files-found: error
